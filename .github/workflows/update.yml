name: Atualizar dados BEP

on:
  schedule:
    - cron: "*/30 * * * *"   # de 30 em 30 minutos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Gerar dados
        run: python gerar_data.py

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Atualizar dados BEP" || echo "Nada para atualizar"
          git push
