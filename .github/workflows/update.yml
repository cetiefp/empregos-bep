name: Executar Scraper BEP Automático

on:
  schedule:
    - cron: '0 */6 * * *'  # Executa de 6 em 6 horas automaticamente
  workflow_dispatch:       # Botão para execução manual a qualquer hora

permissions:
  contents: write

jobs:
  recortar-e-publicar:
    # Mudamos o sistema operativo para contornar o bloqueio de IP das gamas Linux da Azure
    runs-on: windows-latest
    
    steps:
    - name: Descarregar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependência de Rede
      run: pip install requests

    - name: Executar Sincronização de Texto Python
      run: python gerar_data.py

    - name: Gravar Alterações e Histórico no Repositório
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add data.json estado.json
        git commit -m "Sistema: Atualização incremental via ambiente Windows" -m "Evita bloqueio IP governamental" --allow-empty
        git push origin main
