name: Executar Scraper BEP Automático

on:
  schedule:
    - cron: '0 */6 * * *'  # Executa automaticamente de 6 em 6 horas
  workflow_dispatch:       # Ativa o botão para podermos testar manualmente

permissions:
  contents: write

jobs:
  recortar-e-publicar:
    runs-on: ubuntu-latest
    steps:
    - name: Descarregar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Bibliotecas de Rede e Parsers na Nuvem
      # Instala as dependências necessárias exclusivamente na máquina temporária do GitHub
      run: pip install requests beautifulsoup4 lxml

    - name: Executar Sincronização de Texto Python
      run: python gerar_data.py

    - name: Gravar Alterações no Repositório GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add data.json estado.json
        git commit -m "Sistema: Atualização incremental tolerante via XML Direto" || echo "Sem novidades"
        git push origin main
