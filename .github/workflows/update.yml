name: Executar Scraper BEP Automático

on:
  schedule:
    - cron: '0 */6 * * *'  # Atualiza de 6 em 6 horas de forma automática
  workflow_dispatch:       # Cria um botão para poder executar manualmente a qualquer hora

permissions:
  contents: write

jobs:
  recortar-e-publicar:
    runs-on: ubuntu-latest
    steps:
    - name: Descarregar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Bibliotecas Requeridas
      run: |
        pip install requests beautifulsoup4

    - name: Executar o Scraper
      run: python gerar_data.py

    - name: Atualizar Repositório com as Novas Ofertas
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add data.json
        git commit -m "Sistema: Atualização automática de dados da BEP" || echo "Sem novidades no portal para gravar."
        git push origin main
